<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Luxelle Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(to bottom right, #FBF8F3, #FFF8DC, #D7CCC8); 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
        }
        .reset-card { 
            border-radius: 20px; 
            border: 1px solid rgba(141, 110, 99, 0.2); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
            background: white;
            padding: 24px;
        }
        .btn-luxelle { 
            background-color: #8D6E63; 
            color: white; 
            border-radius: 20px; 
            border: none; 
            padding: 12px; 
            font-weight: bold; 
            width: 100%;
            height: 50px;
        }
        .btn-luxelle:hover { background-color: #6D4C41; color: white; }
        .btn-luxelle:disabled { background-color: #BCAAA4; cursor: not-allowed; }
        
        .form-control { 
            border-radius: 15px; 
            padding: 12px; 
            border: 1px solid #EFEBE9; 
        }
        .form-control:focus {
            border-color: #8D6E63;
            box-shadow: 0 0 0 0.2rem rgba(141, 110, 99, 0.25);
        }
        .form-control:disabled { background-color: #f9f9f9; }

        .otp-info-box {
            background-color: #FFF8DC;
            border-radius: 20px;
            border: 1px solid rgba(141, 110, 99, 0.2);
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
        }
        .error-container {
            background-color: #FFEBEE;
            color: #D32F2F;
            padding: 12px;
            border-radius: 20px;
            border: 1px solid #FFCDD2;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        .back-link {
            color: #8D6E63;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container d-flex justify-content-center">
        <div class="reset-card shadow">
            <div class="text-center mb-4">
                <h3 id="title-text" style="color: #3E2723; font-weight: 500;">Reset Password</h3>
                <p id="instruction-text" style="color: #6D4C41;">Enter your email to receive a reset OTP</p>
            </div>

            <div id="error-box" class="error-container d-none"></div>

            <div id="step-1">
                <div class="mb-4">
                    <label class="small fw-bold mb-1">Email</label>
                    <input type="email" id="email-input" class="form-control" placeholder="you@example.com">
                </div>
            </div>

            <div id="step-2" class="d-none">
                <div class="otp-info-box">
                    <div class="small fw-bold" style="color: #3E2723;">The OTP Code already sent to</div>
                    <div id="display-email" style="color: #8D6E63; font-weight: bold; font-family: monospace; letter-spacing: 1px;"></div>
                </div>

                <div class="mb-3">
                    <label class="small fw-bold mb-1">OTP Code</label>
                    <input type="number" id="otp-input" class="form-control" placeholder="Enter OTP from your email" style="background-color: #F3EFEA;">
                </div>

                <div class="mb-3">
                    <label class="small fw-bold mb-1">New Password</label>
                    <input type="password" id="new-password" class="form-control" placeholder="••••••••">
                </div>

                <div class="mb-4">
                    <label class="small fw-bold mb-1">Confirm New Password</label>
                    <input type="password" id="confirm-password" class="form-control" placeholder="••••••••">
                </div>
            </div>

            <button id="main-btn" onclick="handleMainAction()" class="btn btn-luxelle mb-3">Send OTP</button>

            <div class="text-center">
                <a onclick="handleBack()" class="back-link small">Back to Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Setup Supabase
        const _supabase = supabase.createClient(
            'https://bnjjclwlxlrtduupunfw.supabase.co', 
            'sb_publishable_JL8x0bo17UvFdojemnZipw_CBSYxfY9'
        );

        // UI State
        let isOtpSent = false;
        let isLoading = false;

        const errorBox = document.getElementById('error-box');
        const mainBtn = document.getElementById('main-btn');
        const step1 = document.getElementById('step-1');
        const step2 = document.getElementById('step-2');
        const emailInput = document.getElementById('email-input');
        const instructionText = document.getElementById('instruction-text');

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.classList.remove('d-none');
            isLoading = false;
            updateButtonState();
        }

        function updateButtonState() {
            if (isLoading) {
                mainBtn.disabled = true;
                mainBtn.innerText = isOtpSent ? 'Processing...' : 'Sending...';
            } else {
                mainBtn.disabled = false;
                mainBtn.innerText = isOtpSent ? 'Reset Password' : 'Send OTP';
            }
        }

        // Fungsi Utama (Router antara Send OTP atau Reset Password)
        async function handleMainAction() {
            errorBox.classList.add('d-none');
            if (!isOtpSent) {
                await sendOtp();
            } else {
                await resetPassword();
            }
        }

        // 1. _sendOtp logic
        async function sendOtp() {
            const email = emailInput.value.trim();

            if (!email) return showError('Email is required');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) return showError('Invalid email format');

            isLoading = true;
            updateButtonState();

            try {
                const { error } = await _supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/login.html', 
                });

                if (error) throw error;

                // Success transition
                isOtpSent = true;
                step1.classList.add('d-none');
                step2.classList.remove('d-none');
                document.getElementById('display-email').innerText = email;
                instructionText.innerText = 'Enter the OTP and your new password';
                document.querySelector('.back-link').innerText = 'Back';
                
            } catch (err) {
                showError('Failed to send OTP: ' + err.message);
            } finally {
                isLoading = false;
                updateButtonState();
            }
        }

        // 2. _resetPassword logic
        async function resetPassword() {
            const email = emailInput.value.trim();
            const otp = document.getElementById('otp-input').value.trim();
            const newPass = document.getElementById('new-password').value.trim();
            const confirmPass = document.getElementById('confirm-password').value.trim();

            if (!otp || !newPass || !confirmPass) return showError('All fields are required');
            if (newPass !== confirmPass) return showError('New password and confirmation do not match');
            if (newPass.length < 6) return showError('Password must be at least 6 characters');

            isLoading = true;
            updateButtonState();

            try {
                // Verify OTP
                const { error: verifyError } = await _supabase.auth.verifyOtp({
                    email: email,
                    token: otp,
                    type: 'recovery'
                });

                if (verifyError) throw verifyError;

                // Update Password
                const { error: updateError } = await _supabase.auth.updateUser({
                    password: newPass
                });

                if (updateError) throw updateError;

                alert('Password has been reset successfully!');
                window.location.href = 'login.html';

            } catch (err) {
                showError('Failed to reset password: ' + err.message);
            } finally {
                isLoading = false;
                updateButtonState();
            }
        }

        function handleBack() {
            if (isOtpSent) {
                // Reset UI ke Tahap 1
                isOtpSent = false;
                step1.classList.remove('d-none');
                step2.classList.add('d-none');
                instructionText.innerText = 'Enter your email to receive a reset OTP';
                document.querySelector('.back-link').innerText = 'Back to Login';
                updateButtonState();
            } else {
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
