<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Pre-Order Admin - Luxelle Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --luxelle-brown: #8D6E63;
            --luxelle-bg: #FBF8F3;
            --luxelle-card-bg: #FFF8F6;
        }
        body { background-color: var(--luxelle-bg); padding-bottom: 80px; min-height: 100vh; }

        .page-header {
            background-color: var(--luxelle-brown);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .order-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }
        
        .customer-avatar {
            width: 50px;
            height: 50px;
            background-color: #eee;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: #757575;
        }

        .order-info { flex-grow: 1; }
        .order-title { font-weight: bold; color: #333; margin-bottom: 2px; font-size: 15px; }
        .order-meta { font-size: 13px; color: #757575; }

        .luxelle-modal .modal-content {
            border-radius: 25px;
            background-color: #FDF1ED;
            border: none;
            padding: 20px;
        }
        .btn-tutup {
            background: transparent;
            border: none;
            color: var(--luxelle-brown);
            font-weight: bold;
            float: right;
            margin-top: 20px;
        }

        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; background: white;
            display: flex; justify-content: space-around; padding: 12px 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05); z-index: 1000;
        }
        .nav-link-custom { text-align: center; color: #BDBDBD; text-decoration: none; font-size: 11px; flex: 1; }
        .nav-link-custom.active { color: var(--luxelle-brown); font-weight: bold; }
        .nav-link-custom i { font-size: 20px; margin-bottom: 4px; display: block; }
    </style>
</head>
<body>

    <div class="page-header shadow-sm">
        <h5 class="mb-0 fw-bold">Data Pre-Order Admin</h5>
        <div>
            <i class="fas fa-download me-3" style="cursor:pointer;" title="Export CSV" onclick="exportToCSV()"></i>
            <i class="fas fa-sync-alt" style="cursor:pointer;" title="Refresh Data" onclick="fetchOrders()"></i>
        </div>
    </div>

    <div class="container py-4" id="order-list-container">
        <div class="text-center mt-5" id="loader">
            <div class="spinner-border text-brown" role="status"></div>
        </div>
    </div>

    <div class="modal fade luxelle-modal" id="orderDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered px-4">
            <div class="modal-content shadow">
                <div id="modal-content-body"></div>
                <button type="button" class="btn-tutup" data-bs-dismiss="modal">Tutup</button>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="admin_dashboard.html" class="nav-link-custom"><i class="fas fa-th-large"></i>Home</a>
        <a href="#" class="nav-link-custom active"><i class="fas fa-receipt"></i>Orders</a>
        <a href="adminMenuPage.html" class="nav-link-custom"><i class="fas fa-birthday-cake"></i>Menu</a>
        <a href="adminAccountPage.html" class="nav-link-custom"><i class="fas fa-users"></i>Users</a>
        <a href="adminProfilePage.html" class="nav-link-custom"><i class="fas fa-user"></i>Profile</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        const _supabase = supabase.createClient(
            'https://bnjjclwlxlrtduupunfw.supabase.co', 
            'sb_publishable_JL8x0bo17UvFdojemnZipw_CBSYxfY9'
        );

        const listContainer = document.getElementById('order-list-container');
        const detailModal = new bootstrap.Modal(document.getElementById('orderDetailModal'));

        // Fungsi Fetch Data
        async function fetchOrders() {
            document.getElementById('loader').classList.remove('d-none');
            try {
                const { data: orders, error } = await _supabase
                    .from('po') 
                    .select(`id, status, created_at, user_id, profiles (name)`)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                renderOrders(orders);
            } catch (err) {
                console.error("Error:", err);
                listContainer.innerHTML = `<div class="alert alert-danger mx-3">Gagal memuat data: ${err.message}</div>`;
            } finally {
                document.getElementById('loader').classList.add('d-none');
            }
        }

        // Fungsi Render List
        function renderOrders(orders) {
            if (!orders || orders.length === 0) {
                listContainer.innerHTML = '<div class="text-center text-muted mt-5">Tidak ada data pre-order</div>';
                return;
            }

            listContainer.innerHTML = orders.map(order => `
                <div class="order-card shadow-sm" onclick="showDetail(${order.id})">
                    <div class="customer-avatar"><i class="fas fa-user"></i></div>
                    <div class="order-info">
                        <div class="order-title">Order #${order.id} - ${order.profiles ? order.profiles.name : 'User'}</div>
                        <div class="order-meta">
                            Status: <span class="badge ${order.status === 'confirmed' ? 'bg-success' : 'bg-warning'}">${order.status}</span><br>
                            Waktu: ${new Date(order.created_at).toLocaleString('id-ID')}
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-muted"></i>
                </div>
            `).join('');
        }

        // FUNGSI EKSPOR CSV YANG DIPERBAIKI
        async function exportToCSV() {
            try {
                // 1. Ambil data PO beserta detail item dan nama menu
                // Kita melakukan join: po -> po_menu -> menu
                const { data: orders, error } = await _supabase
                    .from('po')
                    .select(`
                        id, 
                        status, 
                        created_at,
                        profiles (name, email),
                        po_menu (
                            qty,
                            menu (name, price)
                        )
                    `)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                if (!orders || orders.length === 0) return alert("Tidak ada data untuk diekspor.");

                // 2. Definisikan header CSV (ditambah Item Name, Qty, dan Price)
                let csvContent = "Order ID,Customer Name,Email,Item Name,Qty,Price,Subtotal,Status,Date\n";

                // 3. Masukkan data ke dalam baris CSV
                orders.forEach(order => {
                    const customerName = order.profiles ? order.profiles.name : 'Unknown';
                    const customerEmail = order.profiles ? order.profiles.email : '-';
                    const orderStatus = order.status || 'confirmed';
                    const orderDate = new Date(order.created_at).toLocaleString('id-ID');

                    // Jika ada item di po_menu, buat baris untuk setiap item
                    if (order.po_menu && order.po_menu.length > 0) {
                        order.po_menu.forEach(item => {
                            const itemName = item.menu ? item.menu.name : 'Unknown Item';
                            const itemPrice = item.menu ? item.menu.price : 0;
                            const subtotal = item.qty * itemPrice;

                            const row = [
                                order.id,
                                `"${customerName}"`,
                                customerEmail,
                                `"${itemName}"`,
                                item.qty,
                                itemPrice,
                                subtotal,
                                orderStatus,
                                `"${orderDate}"`
                            ].join(",");
                            csvContent += row + "\n";
                        });
                    } else {
                        // Jika PO tidak memiliki item (data kosong)
                        const row = [order.id, `"${customerName}"`, customerEmail, "No Items", 0, 0, 0, orderStatus, `"${orderDate}"`].join(",");
                        csvContent += row + "\n";
                    }
                });

                // 4. Proses Download File
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                const timestamp = new Date().toISOString().split('T')[0];
                
                link.setAttribute("href", url);
                link.setAttribute("download", `Luxelle_Detailed_Orders_${timestamp}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                alert("Data lengkap berhasil diekspor!");

            } catch (err) {
                console.error("Export error:", err);
                alert("Gagal ekspor: " + err.message);
            }
        }

        async function showDetail(orderId) {
            const modalBody = document.getElementById('modal-content-body');
            modalBody.innerHTML = '<div class="text-center"><div class="spinner-border spinner-border-sm"></div></div>';
            detailModal.show();

            try {
                // Pastikan merujuk ke tabel 'po'
                const { data: items, error } = await _supabase
                    .from('po')
                    .select('id, status')
                    .eq('id', orderId)
                    .single();

                modalBody.innerHTML = `
                    <div class="detail-title">Detail Order #${orderId}</div>
                    <div class="detail-item">
                        <div class="fw-bold">Status Pesanan: ${items.status}</div>
                        <p class="text-muted small">Cranberry Walnut Sourdough Bread (Mockup)</p>
                    </div>`;
            } catch (err) {
                modalBody.innerHTML = '<div class="text-danger">Gagal memuat detail</div>';
            }
        }

        window.onload = fetchOrders;
    </script>
</body>
</html>
