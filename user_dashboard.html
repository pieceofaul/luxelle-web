<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxelle Bakery - Customer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --brown-luxelle: #8D6E63; --bg-light: #FBF8F3; }
        body { background-color: var(--bg-light); font-family: 'Poppins', sans-serif; padding-bottom: 80px; }
        .bg-luxelle { background-color: var(--brown-luxelle) !important; }
        .menu-card { border: none; border-radius: 20px; overflow: hidden; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.02); transition: 0.3s; }
        .menu-card:hover { transform: translateY(-5px); }
        .menu-img { height: 140px; object-fit: cover; width: 100%; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 1000; }
        .nav-item { border: none; background: none; color: #BDBDBD; flex: 1; text-align: center; }
        .nav-item.active { color: var(--brown-luxelle); }
        .page-section { display: none; padding: 20px; }
        .page-section.active { display: block; }
        .btn-luxelle { background-color: var(--brown-luxelle); color: white; border-radius: 20px; }
        .avatar-wrapper { position: relative; display: inline-block; }
        .upload-badge { position: absolute; bottom: 0; right: 0; background: var(--brown-luxelle); color: white; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; cursor: pointer; }
    </style>
</head>
<body>

    <div id="shop" class="page-section active">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold mb-0">Luxelle Menu</h4>
                <p class="text-muted small">Khusus Member (Qty: 1)</p>
            </div>
            <div class="text-end">
                <span id="role-badge" class="badge bg-secondary mb-1 d-block" style="font-size: 10px;">Checking...</span>
                <img id="user-avatar-small" src="https://via.placeholder.com/40" class="rounded-circle" width="40" height="40" style="object-fit: cover;">
            </div>
        </div>
        <div class="row g-3 mt-1" id="menu-catalog"></div>
    </div>

    <div id="my-orders" class="page-section">
        <h4 class="fw-bold mb-4">Riwayat Pesanan</h4>
        <div id="order-history-list"></div>
    </div>

    <div id="user-profile" class="page-section">
        <h4 class="fw-bold mb-4">Profil Akun</h4>
        <div class="card border-0 rounded-4 p-4 shadow-sm text-center">
            <div class="avatar-wrapper mb-3">
                <img id="user-avatar-big" src="https://via.placeholder.com/100" class="rounded-circle shadow" width="100" height="100" style="object-fit: cover;">
                <label for="input-avatar" class="upload-badge"><i class="fas fa-camera fa-sm"></i></label>
                <input type="file" id="input-avatar" class="d-none" accept="image/*" onchange="updatePhoto()">
            </div>
            <div class="mb-3 text-start">
                <label class="small fw-bold mb-1">Nama Lengkap</label>
                <div class="input-group">
                    <input type="text" id="edit-name" class="form-control">
                    <button class="btn btn-luxelle" onclick="updateName()">Update</button>
                </div>
            </div>
            <hr>
            <p id="user-email-display" class="text-muted small mb-3">-</p>
            <button class="btn btn-outline-secondary btn-sm w-100 rounded-pill mb-3" onclick="loadUserData()">Refresh Status Member</button>
            <button class="btn btn-danger w-100 rounded-pill" onclick="handleLogout()">Sign Out</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="changeTab('shop', this)"><i class="fas fa-bread-slice d-block"></i><span>Shop</span></button>
        <button class="nav-item" onclick="changeTab('my-orders', this)"><i class="fas fa-receipt d-block"></i><span>Orders</span></button>
        <button class="nav-item" onclick="changeTab('user-profile', this)"><i class="fas fa-user d-block"></i><span>Profile</span></button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const _supabase = supabase.createClient('https://bnjjclwlxlrtduupunfw.supabase.co', 'sb_publishable_JL8x0bo17UvFdojemnZipw_CBSYxfY9');
        let currentUser = null;

        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = session.user;
            await loadUserData(); 
            loadUserMenu();
        };

        // Memuat data profil dan ROLE terbaru
        async function loadUserData() {
            try {
                const { data: profile, error } = await _supabase
                    .from('profiles')
                    .select('*')
                    .eq('user_id', currentUser.id)
                    .single();
                
                if (error) throw error;

                if (profile) {
                    const currentRole = profile.role || 'Basic';
                    
                    // Update Badge UI secara visual
                    const badge = document.getElementById('role-badge');
                    badge.innerText = currentRole;
                    badge.className = `badge mb-1 d-block ${currentRole === 'Member' ? 'bg-success' : 'bg-secondary'}`;

                    document.getElementById('edit-name').value = profile.name || '';
                    document.getElementById('user-email-display').innerText = currentUser.email;
                    const avatar = profile.avatar_url || 'https://via.placeholder.com/100';
                    document.getElementById('user-avatar-small').src = avatar;
                    document.getElementById('user-avatar-big').src = avatar;
                }
            } catch (err) {
                console.error("Gagal load profil:", err.message);
            }
        }

        // FUNGSI PRE-ORDER DENGAN VALIDASI ROLE LANGSUNG KE DATABASE
        async function quickPreOrder(menuId, menuName) {
            try {
                // 1. Cek role terbaru langsung dari DB setiap kali tombol ditekan
                const { data: check, error: checkErr } = await _supabase
                    .from('profiles')
                    .select('role')
                    .eq('user_id', currentUser.id)
                    .single();

                if (checkErr) throw checkErr;

                // 2. Validasi Role
                if (check.role !== 'Member') {
                    alert("gabisa, harus member! Akun Anda saat ini: " + (check.role || 'Basic'));
                    return; 
                }

                // 3. Konfirmasi Pesanan
                if(!confirm(`Pesan 1 ${menuName} sekarang?`)) return;

                // 4. Proses Simpan Header Pesanan (po)
                const { data: po, error: poErr } = await _supabase.from('po').insert({ 
                    user_id: currentUser.id, 
                    status: 'Pending',
                    created_at: new Date().toISOString()
                }).select().single();

                if (poErr) throw poErr;

                // 5. Proses Simpan Detail (po_menu)
                const { error: itemErr } = await _supabase.from('po_menu').insert({ 
                    po_id: po.id, 
                    menu_id: menuId, 
                    qty: 1 
                });

                if (itemErr) throw itemErr;

                alert("Berhasil! Pesanan " + menuName + " sedang diproses.");
                changeTab('my-orders', document.querySelector('[onclick*="my-orders"]'));
                
            } catch (err) { 
                alert("Gagal Pre-Order: " + err.message); 
            }
        }

        async function loadUserMenu() {
            const { data } = await _supabase.from('menu').select('*');
            const catalog = document.getElementById('menu-catalog');
            if(data) {
                catalog.innerHTML = data.map(m => `
                    <div class="col-6">
                        <div class="menu-card h-100 p-2 shadow-sm text-center">
                            <img src="${m.img_url || 'https://via.placeholder.com/150'}" class="menu-img rounded-3 mb-2">
                            <div class="small fw-bold text-truncate">${m.name}</div>
                            <div class="d-flex justify-content-between align-items-center mt-2 px-1">
                                <span class="text-luxelle fw-bold small">Rp ${m.price.toLocaleString()}</span>
                                <button class="btn btn-sm btn-luxelle rounded-circle" onclick="quickPreOrder(${m.id}, '${m.name}')">
                                    <i class="fas fa-plus"></i>
                                </button>
                            </div>
                        </div>
                    </div>`).join('');
            }
        }

        async function updatePhoto() {
            const fileInput = document.getElementById('input-avatar');
            if (fileInput.files.length === 0) return;
            const file = fileInput.files[0];
            const fileName = `${currentUser.id}_${Date.now()}.${file.name.split('.').pop()}`;
            try {
                const { error: uploadError } = await _supabase.storage.from('profiles').upload(fileName, file);
                if (uploadError) throw uploadError;
                const { data: { publicUrl } } = _supabase.storage.from('profiles').getPublicUrl(fileName);
                await _supabase.from('profiles').update({ avatar_url: publicUrl }).eq('user_id', currentUser.id);
                alert("Foto diperbarui!");
                loadUserData();
            } catch (err) { alert("Gagal upload: " + err.message); }
        }

        async function updateName() {
            const newName = document.getElementById('edit-name').value;
            const { error } = await _supabase.from('profiles').update({ name: newName }).eq('user_id', currentUser.id);
            if(error) alert(error.message); else alert("Nama diperbarui!");
            loadUserData();
        }

        async function loadMyOrders() {
            const { data } = await _supabase.from('po').select('*, po_menu(qty, menu(name))').eq('user_id', currentUser.id).order('created_at', {ascending: false});
            const list = document.getElementById('order-history-list');
            if(data && data.length > 0) {
                list.innerHTML = data.map(o => {
                    const items = o.po_menu.map(i => `${i.menu?.name || 'Item'} (x${i.qty})`).join(', ');
                    return `<div class="card border-0 mb-3 shadow-sm rounded-4 p-3 small">
                        <div class="d-flex justify-content-between align-items-center">
                            <strong>Order #${o.id}</strong>
                            <span class="badge bg-light text-brown border rounded-pill px-2">${o.status}</span>
                        </div>
                        <div class="mt-2 text-dark">Pesanan: ${items}</div>
                        <div class="text-muted mt-1 small"><i class="far fa-clock me-1"></i> ${new Date(o.created_at).toLocaleString('id-ID')}</div>
                    </div>`;
                }).join('');
            } else { 
                list.innerHTML = '<p class="text-center text-muted py-5 small">Belum ada riwayat pesanan.</p>'; 
            }
        }

        function changeTab(pageId, btn) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if(btn) btn.classList.add('active');
            if(pageId === 'my-orders') loadMyOrders();
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
