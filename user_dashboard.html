<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxelle Bakery - Customer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --brown-luxelle: #8D6E63; --bg-light: #FBF8F3; }
        body { background-color: var(--bg-light); font-family: 'Poppins', sans-serif; padding-bottom: 80px; }
        .bg-luxelle { background-color: var(--brown-luxelle) !important; }
        
        /* Katalog Menu Styling */
        .menu-card { border: none; border-radius: 20px; overflow: hidden; background: white; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .menu-card:hover { transform: translateY(-5px); }
        .menu-img { height: 140px; object-fit: cover; width: 100%; }
        
        /* Keranjang Floating Button */
        .cart-float { position: fixed; bottom: 90px; right: 20px; background: var(--brown-luxelle); color: white; width: 60px; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 15px rgba(141, 110, 99, 0.4); z-index: 1000; text-decoration: none; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #eee; z-index: 1000; }
        .nav-item { border: none; background: none; color: #BDBDBD; flex: 1; text-align: center; }
        .nav-item.active { color: var(--brown-luxelle); }
        .nav-item i { font-size: 22px; display: block; }
        .nav-item span { font-size: 11px; }
        
        .page-section { display: none; padding: 20px; }
        .page-section.active { display: block; }
        .category-pill { background: white; border: 1px solid #eee; border-radius: 20px; padding: 5px 15px; font-size: 12px; white-space: nowrap; cursor: pointer; }
        .category-pill.active { background: var(--brown-luxelle); color: white; border-color: var(--brown-luxelle); }
    </style>
</head>
<body>

    <div id="shop" class="page-section active">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h4 class="fw-bold mb-0">Freshly Baked!</h4>
                <p class="text-muted small">Choose your favorite treats</p>
            </div>
            <img id="user-avatar-small" src="https://via.placeholder.com/40" class="rounded-circle" width="40" height="40">
        </div>

        <div class="d-flex gap-2 overflow-auto pb-3 no-scrollbar" id="categories">
            <div class="category-pill active">All</div>
            <div class="category-pill">Bread</div>
            <div class="category-pill">Cake</div>
            <div class="category-pill">Cookies</div>
            <div class="category-pill">Pastry</div>
        </div>

        <div class="row g-3 mt-1" id="menu-catalog">
            </div>
    </div>

    <div id="my-orders" class="page-section">
        <h4 class="fw-bold mb-4">My Orders</h4>
        <div id="order-history-list">
            <div class="text-center py-5">
                <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                <p class="text-muted">No orders yet.</p>
            </div>
        </div>
    </div>

    <div id="user-profile" class="page-section">
        <h4 class="fw-bold mb-4">Account</h4>
        <div class="card border-0 rounded-4 p-4 text-center shadow-sm">
            <img id="user-avatar-big" src="https://via.placeholder.com/100" class="rounded-circle mx-auto mb-3" width="100" height="100">
            <h5 id="user-full-name" class="fw-bold mb-1">-</h5>
            <p id="user-email" class="text-muted small mb-3">-</p>
            <hr>
            <button class="btn btn-outline-secondary w-100 rounded-pill mb-2 border-0" onclick="alert('Settings')">
                <i class="fas fa-cog me-2"></i>Settings
            </button>
            <button class="btn btn-danger w-100 rounded-pill mt-2" onclick="handleLogout()">
                <i class="fas fa-sign-out-alt me-2"></i>Sign Out
            </button>
        </div>
    </div>

    <a href="#" class="cart-float">
        <i class="fas fa-shopping-cart"></i>
    </a>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="changeTab('shop', this)">
            <i class="fas fa-bread-slice"></i><span>Shop</span>
        </button>
        <button class="nav-item" onclick="changeTab('my-orders', this)">
            <i class="fas fa-receipt"></i><span>Orders</span>
        </button>
        <button class="nav-item" onclick="changeTab('user-profile', this)">
            <i class="fas fa-user"></i><span>Profile</span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const _supabase = supabase.createClient('https://bnjjclwlxlrtduupunfw.supabase.co', 'sb_publishable_JL8x0bo17UvFdojemnZipw_CBSYxfY9');
        
        let currentUser = null;

        window.onload = async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) window.location.href = 'login.html';
            
            currentUser = session.user;
            loadUserMenu();
            loadUserData();
        };

        function changeTab(pageId, btn) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            btn.classList.add('active');
            
            if(pageId === 'my-orders') loadMyOrders();
        }

        async function loadUserMenu() {
            const { data } = await _supabase.from('menu').select('*');
            const catalog = document.getElementById('menu-catalog');
            catalog.innerHTML = data.map(m => `
                <div class="col-6">
                    <div class="menu-card h-100 shadow-sm">
                        <img src="${m.img_url}" class="menu-img">
                        <div class="p-3">
                            <h6 class="fw-bold mb-1 small">${m.name}</h6>
                            <div class="d-flex justify-content-between align-items-center mt-2">
                                <span class="text-luxelle fw-bold small">Rp ${m.price.toLocaleString()}</span>
                                <button class="btn btn-sm btn-luxelle rounded-circle shadow-sm" onclick="alert('Added to cart')">
                                    <i class="fas fa-plus fa-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function loadUserData() {
            const { data: profile } = await _supabase.from('profiles').select('*').eq('user_id', currentUser.id).single();
            if(profile) {
                document.getElementById('user-full-name').innerText = profile.name;
                document.getElementById('user-email').innerText = currentUser.email;
                if(profile.avatar_url) {
                    document.getElementById('user-avatar-small').src = profile.avatar_url;
                    document.getElementById('user-avatar-big').src = profile.avatar_url;
                }
            }
        }

        async function loadMyOrders() {
            const { data } = await _supabase.from('po').select('*').eq('user_id', currentUser.id);
            const list = document.getElementById('order-history-list');
            if(data.length > 0) {
                list.innerHTML = data.map(o => `
                    <div class="card border-0 mb-3 shadow-sm rounded-4 p-3">
                        <div class="d-flex justify-content-between">
                            <span class="fw-bold small">Order #${o.id}</span>
                            <span class="badge bg-light text-brown small rounded-pill">${o.status}</span>
                        </div>
                        <p class="text-muted mb-0 mt-1" style="font-size: 11px;">Date: ${new Date(o.created_at).toLocaleDateString()}</p>
                    </div>
                `).join('');
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
