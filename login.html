<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Luxelle Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: linear-gradient(to bottom right, #FBF8F3, #FFF8DC, #D7CCC8); min-height: 100vh; }
        .login-card { border-radius: 20px; border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .btn-luxelle { background-color: #8D6E63; color: white; border-radius: 20px; border: none; padding: 12px; }
        .btn-luxelle:hover { background-color: #6D4C41; color: white; }
        .form-control { border-radius: 15px; padding: 12px; border: 1px solid #EFEBE9; }
        
        .forgot-password-link {
            color: #A1887F;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .forgot-password-link:hover {
            color: #8D6E63;
            text-decoration: underline;
        }
    </style>
</head>
<body class="d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card login-card p-4">
                    <div class="text-center mb-4">
                        <div class="bg-light d-inline-block p-3 rounded-circle mb-3">
                            <i class="fas fa-bread-slice fa-3x" style="color: #8D6E63;"></i>
                        </div>
                        <h2 class="fw-bold" style="color: #3E2723;">Welcome Back</h2>
                        <p class="text-muted">Sign in to your Luxelle account</p>
                    </div>

                    <div id="error-box" class="alert alert-danger d-none small"></div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••">
                    </div>

                    <div class="text-end mb-4">
                        <a href="forgot_password.html" class="forgot-password-link">Forgot password?</a>
                    </div>
                    
                    <button id="login-btn" onclick="handleLogin()" class="btn btn-luxelle w-100 fw-bold shadow-sm">Sign In</button>

                    <div class="text-center mt-4">
                        <p class="small text-muted">Don't have an account? <a href="register.html" style="color: #8D6E63; text-decoration: none; font-weight: bold;">Sign up</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const supabaseUrl = 'https://bnjjclwlxlrtduupunfw.supabase.co';
        const supabaseKey = 'sb_publishable_JL8x0bo17UvFdojemnZipw_CBSYxfY9';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errorBox = document.getElementById('error-box');

            if(!email || !password) {
                errorBox.innerText = "Please enter both email and password.";
                errorBox.classList.remove('d-none');
                return;
            }

            btn.disabled = true;
            btn.innerText = "Signing in...";
            errorBox.classList.add('d-none');

            try {
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;

                const { data: profile } = await _supabase
                    .from('profiles')
                    .select('role, name')
                    .eq('user_id', data.user.id)
                    .single();

                await _supabase.from('profiles').update({ last_login: new Date().toISOString() }).eq('user_id', data.user.id);

                const role = profile?.role?.toLowerCase() || 'customer';
                if (role === 'admin') {
                    window.location.href = 'admin_dashboard.html';
                } else {
                    window.location.href = 'user_dashboard.html';
                }

            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.classList.remove('d-none');
                btn.disabled = false;
                btn.innerText = "Sign In";
            }
        }
    </script>
</body>
</html>
