<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxelle Bakery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #FBF8F3; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .splash-logo { text-align: center; animation: fadeIn 2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="splash-logo">
        <h1 style="color: #8D6E63; font-weight: bold;">Luxelle Bakery</h1>
        <div class="spinner-border text-brown" style="color: #8D6E63;" role="status"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Inisialisasi Supabase
        const supabaseUrl = 'https://bnjjclwlxlrtduupunfw.supabase.co';
        const supabaseKey = 'sb_publishable_JL8x0bo17UvFdojemnZipw_CBSYxfY9';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function checkSession() {
            // Simulasi SplashScreen (seperti di main.dart)
            setTimeout(async () => {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) {
                    // Cek role untuk menentukan dashboard
                    const { data: profile } = await _supabase.from('profiles').select('role').eq('user_id', session.user.id).single();
                    if (profile?.role.toLowerCase() === 'admin') {
                        window.location.href = 'admin_dashboard.html';
                    } else {
                        window.location.href = 'user_dashboard.html';
                    }
                } else {
                    window.location.href = 'login.html';
                }
            }, 2000); // Tunda 2 detik untuk efek splash
        }
        checkSession();
    </script>
</body>
</html>
